<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="진료비 수납">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>외래 진료비 수납</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
body{-webkit-tap-highlight-color:transparent}

/* Layout: single phone-width column; app bar, summary, two info cards, sticky pay bar */
:root{
  --bg:#ffffff; --page:#eef2f8; --fg:#1b2230; --muted:#6b7487; --faint:#9aa3b5;
  --card:#f5f7fb; --line:#e3e8f1; --accent:#2f6bf0; --accent-soft:#e8effe; --ok:#1f9d6a;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a23; --page:#0d1118; --fg:#e8ecf4; --muted:#9aa4b8; --faint:#6d778b;
  --card:#1d2430; --line:#2a3342; --accent:#6d9bff; --accent-soft:#1f2c47; --ok:#4fd19b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a23; --page:#0d1118; --fg:#e8ecf4; --muted:#9aa4b8; --faint:#6d778b;
  --card:#1d2430; --line:#2a3342; --accent:#6d9bff; --accent-soft:#1f2c47; --ok:#4fd19b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);margin:0}
.app{max-width:430px;min-height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar h1{flex:1;font-size:17px;font-weight:700;margin:0}
.icon{width:40px;height:40px;border:0;background:none;color:var(--fg);border-radius:10px;display:grid;place-items:center;cursor:pointer}
.icon:hover{background:var(--card)}
.icon:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon svg{width:22px;height:22px}
main{flex:1;display:flex;flex-direction:column;gap:16px;
  padding-block:8px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 7px}
.total{margin:8px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.total b{color:var(--accent)}
.sample{font-size:12px;color:var(--faint);margin-top:4px}
.card{background:var(--card);border-radius:12px;padding:16px}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
.info dt{color:var(--muted)} .info dd{margin:0;font-weight:500}
.fees{display:flex;flex-direction:column;gap:12px;font-size:15px}
.row{display:flex;justify-content:space-between;gap:12px}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.row small{font-weight:400;color:var(--muted);margin-left:2px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.row.due span{color:var(--fg);font-size:16px}
.row.due span:last-child{color:var(--accent);font-weight:800}
.section-t{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 -6px}
.paybar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:6}
.btn{width:100%;height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 16px var(--font);cursor:pointer}
.btn.ghost{background:var(--card);color:var(--fg)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:var(--bg);border-radius:18px 18px 0 0;
  padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.btns{display:flex;gap:8px}
.visit{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:14px;font:inherit;cursor:pointer}
.visit[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.visit .t{font-weight:700} .visit .s{font-size:13px;color:var(--muted);margin-top:2px}
.visit .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.paid{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ok)}
.done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.done .ck{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <button class="icon" id="back" aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>결제하기</h1>
    <button class="icon" id="home" aria-label="홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20h-5v-5.5h-6V20H4z"/></svg></button>
    <button class="icon" id="menu" aria-label="진료 내역"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>

  <main id="main"></main>

  <div class="paybar"><button class="btn" id="pay"></button></div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// 예시 데이터: 실제 서비스에서는 병원 시스템에서 받아온 값으로 교체
const visits=[
  {id:"v1",type:"외래",doctor:"김재학",dept:"소화기내과",date:"2026.11.01",
   fees:[["진찰료",2110],["검사료",27200],["약제료",25600]],
   prepaid:10000,interim:10000,selfPay:39500,paid:false},
  {id:"v2",type:"외래",doctor:"이OO",dept:"정형외과",date:"2025.01.28",
   fees:[["진찰료",17610],["영상진단료",32400],["처치료",8900]],
   prepaid:0,interim:5000,selfPay:17700,paid:true},
  {id:"v3",type:"외래",doctor:"박OO",dept:"이비인후과",date:"2025.01.09",
   fees:[["진찰료",17610],["처치료",6200],["검사료",4300]],
   prepaid:0,interim:0,selfPay:4800,paid:true}
];
let cur=visits[0];
const won=n=>n.toLocaleString("ko-KR");
const sum=v=>v.fees.reduce((a,[,x])=>a+x,0);
const due=v=>v.selfPay;
const row=(k,v,cls="")=>`<div class="row ${cls}"><span>${k}</span><span>${won(v)}<small>원</small></span></div>`;

function render(){
  const v=cur,total=sum(v);
  document.getElementById("main").innerHTML=`
    <section>
      <span class="badge">${v.type}</span>
      <p class="total">총 수납 금액 <b>${won(total)}원</b></p>    </section>
    <dl class="card info">
      <dt>진료의</dt><dd>${v.doctor} 진료의</dd>
      <dt>진료과</dt><dd>${v.dept}</dd>
      <dt>진료일</dt><dd>${v.date}</dd>
    </dl>
    <div class="card fees">
      ${v.fees.map(([k,x])=>row(k,x)).join("")}
      <hr>
      ${row("공단 부담",total-v.selfPay)}
      ${row("본인 부담",v.selfPay)}
      <hr>
      ${row(v.paid?"납부 완료":"납부할 금액",v.paid?0:due(v),"due")}
    </div>`;
  const b=document.getElementById("pay");
  b.disabled=v.paid||due(v)===0;
  b.textContent=v.paid?"납부 완료된 진료입니다":`${won(due(v))}원 결제하기`;
}

const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
function open(html){sheet.innerHTML=html;scrim.hidden=false;sheet.querySelector("button")?.focus()}
function close(){scrim.hidden=true}
scrim.addEventListener("click",e=>{if(e.target===scrim)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

function showList(){
  open(`<h2>진료 내역</h2>
    ${visits.map(v=>`<button class="visit" data-id="${v.id}" aria-current="${v===cur}">
      <div><div class="t">${v.dept} · ${v.doctor}</div><div class="s">${v.date} ${v.type}</div></div>
      <div style="text-align:right"><div class="a">${won(sum(v))}원</div>
      ${v.paid?'<span class="paid">✓ 납부 완료</span>':`<span class="s" style="color:var(--accent)">미납 ${won(due(v))}원</span>`}</div>
    </button>`).join("")}`);
  sheet.querySelectorAll(".visit").forEach(b=>b.onclick=()=>{cur=visits.find(v=>v.id===b.dataset.id);render();close();scrollTo(0,0)});
}
document.getElementById("menu").onclick=showList;
document.getElementById("back").onclick=showList;
document.getElementById("home").onclick=()=>{cur=visits.find(v=>!v.paid)||visits[0];render();scrollTo(0,0)};

document.getElementById("pay").onclick=()=>{
  const v=cur;
  open(`<h2>${won(due(v))}원을 결제할까요?</h2>
    <p>${v.date} ${v.dept} ${v.doctor} 진료의 외래 진료비 본인 부담금입니다.</p>
    <div class="btns"><button class="btn ghost" id="no">취소</button><button class="btn" id="yes">결제</button></div>`);
  document.getElementById("no").onclick=close;
  document.getElementById("yes").onclick=()=>{
    v.paid=true;render();
    open(`<div class="done"><div class="ck"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>결제가 완료되었어요</h2><p>${v.dept} · ${v.date}<br>데모 화면이라 실제 결제는 이루어지지 않습니다.</p></div>
      <button class="btn" id="ok">확인</button>`);
    document.getElementById("ok").onclick=close;
  };
};
render();
</script>

</body>
</html>
